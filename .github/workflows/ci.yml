name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # CI cannot see test-data/, so this sweeps test/fixtures/ instead and proves little about
      # geometry. It runs anyway to keep the script itself from rotting, since its real use is
      # local against the corpus.
      - run: npm run smoke

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Formatting only — no rule here has an opinion about the code itself. Everything it
      # reports except max-len is fixable with `npm run format`; an over-long line has to be
      # broken by hand.
      - run: npm run lint

  checkdoc:
    name: checkdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Tag order, missing types, and a documented parameter the signature does not have. jsdoc
      # itself reports none of those, which is why this is a script rather than a generator run.
      #
      # No `npm ci`: the script imports nothing but node builtins, and leaving the install out is
      # what keeps that true — add a dependency to it and this job is where it shows up.
      - run: npm run checkdoc

  checktypes:
    name: checktypes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # Needs the install: this one runs tsc, unlike checkdoc.
      - run: npm ci
      # `tsc --checkJs` over src/, failing only on the diagnostics that mean a comment is wrong —
      # a type name that does not resolve, a JSDoc tag that disagrees with the code. The type-model
      # diagnostics are reported by `npm run checktypes -- --all` and never gate.
      - run: npm run checktypes

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run docs
      # Regenerating must be a no-op. A diff here means docs/api.md and the JSDoc it is generated
      # from have drifted apart — the comments changed and the committed output did not.
      - run: git diff --exit-code docs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Installs the package into test/types as a consumer would, then compiles
      # test/types/consumer.ts against the published declarations.
      - run: npm run typecheck

  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the interpreter the committed fixtures were generated with. ezdxf itself is
          # pinned in requirements.txt.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: test/fixtures/requirements.txt
      - run: pip install -r test/fixtures/requirements.txt
      - run: python test/fixtures/gen/generate.py
      # Regenerating must be a no-op. A diff here means the committed fixtures and the generator
      # that is supposed to produce them have drifted apart.
      - run: git diff --exit-code test/fixtures
